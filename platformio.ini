; ArcadeVox — ESP32-S3-DevKitC-1 **N8** (8 MB di flash, niente PSRAM)
;
; Scheda 2026-08: la DevKitC-1 montata sul PCB e' la variante N8. Rispetto alla
; N16R8 usata sul prototipo cambiano due cose che qui contano davvero: meta'
; flash (quindi partizioni da 8 MB, non da 16) e nessuna PSRAM (quindi niente
; memory_type ottale, che su una N8 impedisce l'avvio).
;
; Tasti  : matrice 4x5 su MCP23017 in I2C
; Audio  : MAX98357 via I2S (driver/i2s.h legacy, Arduino core 2.x)
; Display: GC9A01 240x240 IPS via SPI (Arduino_GFX)
; Luci   : 20 SK6812 in catena, pilotati via RMT
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Pinnato al core Arduino 2.0.x: il driver legacy driver/i2s.h e' quello usato dal
; motore audio, e il driver RMT legacy quello usato dalle luci. Sui core 3.x
; (IDF 5) sarebbero entrambi deprecati e andrebbero riscritti.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; N8: flash QIO 8 MB, nessuna PSRAM.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; USB in modalita' **OTG** (ARDUINO_USB_MODE=0), non seriale/JTAG.
;
; L'ESP32-S3 ha due periferiche USB sugli stessi due piedini. Quella integrata
; (MODE=1) sa fare solo la porta seriale; l'OTG, con TinyUSB dietro, puo'
; presentarsi come qualunque cosa — ed e' l'unica delle due che sa fare MIDI.
; Passando a 0 il synth compare al computer come dispositivo composito: porta
; seriale **e** strumento MIDI, su una presa sola.
;
; Conseguenza pratica: la porta "USB" della DevKitC-1 cambia identita' ad ogni
; avvio del firmware. Se un caricamento non dovesse agganciarla, ci sono due
; strade che funzionano sempre: la porta "UART" della DevKitC-1, che ha un
; convertitore suo ed e' indipendente da tutto questo, oppure tenere premuto
; BOOT mentre si preme RESET per entrare nel bootloader della ROM.
;
; ARDUINO_USB_ON_BOOT resta a zero apposta: cosi' il core registra la seriale ma
; **non** avvia TinyUSB, e il firmware fa in tempo ad aggiungere l'interfaccia
; MIDI prima che il dispositivo compaia. Dopo tinyusb_init non si aggiunge piu'
; niente.
;
; La definizione della board porta gia' -DARDUINO_USB_MODE=1: va **tolta**, non
; solo sovrascritta. Con tutte e due sulla riga di comando il valore che vince
; dipende dall'ordine, e il core finiva compilato in un modo e il firmware
; nell'altro — meta' MIDI compilato, e un dispositivo che non enumera mai come
; strumento.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_ON_BOOT=0
    -O2

; Versione pinnata: dalla 1.5 in poi Arduino_GFX richiede il core Arduino 3.x
; (esp32-hal-periman.h), incompatibile con il core 2.0.14 usato qui per l'I2S legacy.
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    ; Generatore di QR in C puro, indipendente dal core Arduino: nessun vincolo
    ; aggiuntivo sulle versioni pinnate qui sopra.
    ricmoo/QRCode@^0.0.1
