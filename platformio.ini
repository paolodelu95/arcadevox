; ArcadeVox — ESP32-S3-DevKitC-1 **N16R8** (16 MB di flash, 8 MB di PSRAM ottale)
;
; Scheda 2026-08. Questo file ha raccontato per un pezzo una N8 — meta' flash e
; niente PSRAM — ed era sbagliato: la DevKitC-1 montata sul PCB e' una N16R8. Se
; ne e' accorto esptool, che a ogni collegamento scrive cosa ha davanti:
;
;     Features: WiFi, BLE, Embedded PSRAM 8MB (AP_3v3)
;     Detected flash size: 16MB
;
; Configurata da N8 la scheda funzionava lo stesso — una tabella da 8 MB su una
; flash da 16 sta comoda, e la PSRAM inutilizzata non da' fastidio a nessuno — ma
; costava meta' della flash e tutta la memoria esterna. Adesso:
;
;   partizioni  default_16MB.csv : app0 e app1 passano da 3,2 a 6,2 MB l'una, e
;                                  la partizione dati dei suoni da 1,5 a 3,4 MB;
;   memory_type qio_opi          : flash in QIO, PSRAM in **ottale**, che e' cio'
;                                  che la R8 vuole. Su una N8 questa riga
;                                  impedirebbe l'avvio, ed e' il motivo per cui
;                                  prima non c'era.
;
; ATTENZIONE, due conseguenze che non si vedono da qui:
;
; 1) La tabella delle partizioni **non si aggiorna via OTA**: la riscrive solo un
;    caricamento completo con esptool. Una scheda gia' in giro con la tabella da
;    8 MB non passa a questa da sola, e va riprogrammata via cavo.
; 2) Cambiando tabella, la partizione dei suoni si sposta da 0x670000 a 0xc90000.
;    L'immagine caricata prima resta dov'era e nessuno la legge piu': va rifatta
;    con tools/upload_sounds.sh, che l'indirizzo se lo fa dire dalla scheda e
;    quindi non ha bisogno di sapere niente di tutto questo.
;
; La NVS resta a 0x9000 in tutte e due le tabelle: impostazioni, pattern e mappa
; delle luci sopravvivono al passaggio.
;
; Tasti  : matrice 4x5 su MCP23017 in I2C
; Audio  : MAX98357 via I2S (driver/i2s.h legacy, Arduino core 2.x)
; Display: GC9A01 240x240 IPS via SPI (Arduino_GFX)
; Luci   : 20 SK6812 in catena, pilotati via RMT
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Pinnato al core Arduino 2.0.x: il driver legacy driver/i2s.h e' quello usato dal
; motore audio, e il driver RMT legacy quello usato dalle luci. Sui core 3.x
; (IDF 5) sarebbero entrambi deprecati e andrebbero riscritti.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; N16R8: flash QIO 16 MB, PSRAM ottale 8 MB.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; USB in modalita' **OTG** (ARDUINO_USB_MODE=0), non seriale/JTAG.
;
; L'ESP32-S3 ha due periferiche USB sugli stessi due piedini. Quella integrata
; (MODE=1) sa fare solo la porta seriale; l'OTG, con TinyUSB dietro, puo'
; presentarsi come qualunque cosa — ed e' l'unica delle due che sa fare MIDI.
; Passando a 0 il synth compare al computer come dispositivo composito: porta
; seriale **e** strumento MIDI, su una presa sola.
;
; Conseguenza pratica: la porta "USB" della DevKitC-1 cambia identita' ad ogni
; avvio del firmware. Se un caricamento non dovesse agganciarla, ci sono due
; strade che funzionano sempre: la porta "UART" della DevKitC-1, che ha un
; convertitore suo ed e' indipendente da tutto questo, oppure tenere premuto
; BOOT mentre si preme RESET per entrare nel bootloader della ROM.
;
; ARDUINO_USB_ON_BOOT resta a zero apposta: cosi' il core registra la seriale ma
; **non** avvia TinyUSB, e il firmware fa in tempo ad aggiungere l'interfaccia
; MIDI prima che il dispositivo compaia. Dopo tinyusb_init non si aggiunge piu'
; niente.
;
; La definizione della board porta gia' -DARDUINO_USB_MODE=1: va **tolta**, non
; solo sovrascritta. Con tutte e due sulla riga di comando il valore che vince
; dipende dall'ordine, e il core finiva compilato in un modo e il firmware
; nell'altro — meta' MIDI compilato, e un dispositivo che non enumera mai come
; strumento.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    ; Il nome con cui il synth compare fra gli strumenti MIDI del computer. Senza
    ; questo prende quello della board, che in un DAW si legge come
    ; "Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)".
    -DUSB_PRODUCT=\"ArcadeVox\"
    -DUSB_MANUFACTURER=\"ArcadeVox\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_ON_BOOT=0
    ; Senza questa il core non inizializza la PSRAM e ps_malloc() non serve a
    ; niente: memory_type dice al bootloader come parlarle, questa dice al
    ; firmware che c'e'. Oggi nessuno la usa — la RAM interna sta al 33% — ma
    ; averla accesa e' la differenza fra otto megabyte disponibili e otto
    ; megabyte che non esistono.
    -DBOARD_HAS_PSRAM
    -O2

; Versione pinnata: dalla 1.5 in poi Arduino_GFX richiede il core Arduino 3.x
; (esp32-hal-periman.h), incompatibile con il core 2.0.14 usato qui per l'I2S legacy.
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    ; Generatore di QR in C puro, indipendente dal core Arduino: nessun vincolo
    ; aggiuntivo sulle versioni pinnate qui sopra.
    ricmoo/QRCode@^0.0.1
