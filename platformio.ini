; SprigSynth — ESP32-S3 N16R8 (16MB flash, 8MB PSRAM ottale)
;
; Audio  : MAX98357 via I2S (driver/i2s.h legacy, Arduino core 2.x)
; Display: GC9A01 240x240 IPS via SPI (Arduino_GFX)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Pinnato al core Arduino 2.0.x: il driver legacy driver/i2s.h e' quello usato dal
; motore audio. Sui core 3.x (IDF 5) sarebbe deprecato e andrebbe riscritto su i2s_std.h.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; N16R8: flash QIO 16MB + PSRAM ottale (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; L'encoder 2 occupa GPIO 43/44 (UART0), quindi la seriale passa dall'USB nativo:
; flash e monitor vanno fatti dalla porta "USB" della DevKitC-1, non da "UART".
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2

; Versione pinnata: dalla 1.5 in poi Arduino_GFX richiede il core Arduino 3.x
; (esp32-hal-periman.h), incompatibile con il core 2.0.14 usato qui per l'I2S legacy.
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
