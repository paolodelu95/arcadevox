<?xml version="1.0" encoding="UTF-8"?>
<!-- ArcadeVox 2.0 — blueprint del pannello. Quote in millimetri, vista dall'alto. -->
<svg viewBox="0 0 330 200" width="1100" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10,0 L0,0 L0,10" fill="none" stroke="#dde3e9" stroke-width="0.25"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="5" y="5" width="320" height="185" rx="6"/>
    </clipPath>
    <marker id="arrowS" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#5b6570"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="330" height="200" fill="#ffffff"/>
  <rect x="5" y="5" width="320" height="185" rx="6" fill="#f7f8fa" stroke="#16191d" stroke-width="1.2"/>
  <rect x="5" y="5" width="320" height="185" fill="url(#grid)" clip-path="url(#panelClip)"/>

  <!-- ================= ENCODER ================= -->
  <g>
    <g transform="translate(30,58)">
      <circle r="13" fill="#e7ebef" stroke="#4a545e" stroke-width="0.7"/>
      <circle r="4.5" fill="#c9d2da" stroke="#4a545e" stroke-width="0.4"/>
      <line x1="0" y1="-13" x2="0" y2="-8" stroke="#16191d" stroke-width="0.9"/>
      <text y="21" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">ENC 1</text>
      <text y="27" font-size="4.2" text-anchor="middle" fill="#5b6570">CUTOFF</text>
    </g>
    <g transform="translate(64,58)">
      <circle r="13" fill="#e7ebef" stroke="#4a545e" stroke-width="0.7"/>
      <circle r="4.5" fill="#f2b705" stroke="#4a545e" stroke-width="0.4"/>
      <line x1="0" y1="-13" x2="0" y2="-8" stroke="#16191d" stroke-width="0.9"/>
      <text y="21" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">ENC 2</text>
      <text y="27" font-size="4.2" text-anchor="middle" fill="#5b6570">RISONANZA</text>
    </g>
    <g transform="translate(98,58)">
      <circle r="13" fill="#e7ebef" stroke="#4a545e" stroke-width="0.7"/>
      <circle r="4.5" fill="#c9d2da" stroke="#4a545e" stroke-width="0.4"/>
      <line x1="0" y1="-13" x2="0" y2="-8" stroke="#16191d" stroke-width="0.9"/>
      <text y="21" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">ENC 3</text>
      <text y="27" font-size="4.2" text-anchor="middle" fill="#5b6570">VOLUME</text>
    </g>
    <g transform="translate(132,58)">
      <circle r="13" fill="#e7ebef" stroke="#4a545e" stroke-width="0.7"/>
      <circle r="4.5" fill="#1f6feb" stroke="#4a545e" stroke-width="0.4"/>
      <line x1="0" y1="-13" x2="0" y2="-8" stroke="#16191d" stroke-width="0.9"/>
      <text y="21" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">ENC 4</text>
      <text y="27" font-size="4.2" text-anchor="middle" fill="#5b6570">A SCELTA</text>
    </g>
    <text x="81" y="30" font-size="5.4" text-anchor="middle" fill="#0b5fa5" font-weight="bold"
          letter-spacing="0.8">QUATTRO ENCODER · IL CLICK CAMBIA PASSO</text>
  </g>

  <!-- ================= TASTI FUNZIONE (fila alta) ================= -->
  <g>
    <rect x="8" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="17" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN1</text>
    <text x="17" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">ARP</text>

    <rect x="27.05" y="100" width="18" height="18" rx="2" fill="#ffe0cc" stroke="#d92d20" stroke-width="0.7"/>
    <text x="36.05" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN2</text>
    <text x="36.05" y="113" font-size="3.6" text-anchor="middle" fill="#a33" font-weight="bold">8 BIT</text>

    <rect x="46.1" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="55.1" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN3</text>
    <text x="55.1" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">REC</text>

    <rect x="65.15" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="74.15" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN4</text>
    <text x="74.15" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">PLAY</text>

    <rect x="84.2" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="93.2" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN5</text>
    <text x="93.2" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">HOLD</text>

    <rect x="103.25" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="112.25" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN6</text>
    <text x="112.25" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">POLI</text>

    <rect x="122.3" y="100" width="18" height="18" rx="2" fill="#dfe6ec" stroke="#4a545e" stroke-width="0.6"/>
    <text x="131.3" y="107.5" font-size="4.6" text-anchor="middle" fill="#16191d" font-weight="bold">FN7</text>
    <text x="131.3" y="113" font-size="3.6" text-anchor="middle" fill="#5b6570">SCHERMO</text>

    <text x="150" y="110" font-size="4.6" fill="#0b5fa5" font-weight="bold">7 TASTI FUNZIONE</text>
    <text x="150" y="115.5" font-size="4" fill="#5b6570">breve = una cosa, tenuto = un'altra</text>
  </g>

  <!-- ================= TASTI NERI (alterazioni) ================= -->
  <g fill="#2b3138">
    <rect x="19.5" y="124" width="14" height="18" rx="2" stroke="#16191d" stroke-width="0.5"/>
    <text x="26.5" y="135" font-size="4.2" text-anchor="middle" fill="#ffffff">DO#</text>
    <rect x="38.6" y="124" width="14" height="18" rx="2" stroke="#16191d" stroke-width="0.5"/>
    <text x="45.6" y="135" font-size="4.2" text-anchor="middle" fill="#ffffff">RE#</text>
    <rect x="76.7" y="124" width="14" height="18" rx="2" stroke="#16191d" stroke-width="0.5"/>
    <text x="83.7" y="135" font-size="4.2" text-anchor="middle" fill="#ffffff">FA#</text>
    <rect x="95.75" y="124" width="14" height="18" rx="2" stroke="#16191d" stroke-width="0.5"/>
    <text x="102.75" y="135" font-size="4" text-anchor="middle" fill="#ffffff">SOL#</text>
    <rect x="114.8" y="124" width="14" height="18" rx="2" stroke="#16191d" stroke-width="0.5"/>
    <text x="121.8" y="135" font-size="4.2" text-anchor="middle" fill="#ffffff">LA#</text>
  </g>
  <text x="150" y="136" font-size="4.6" fill="#0b5fa5" font-weight="bold">5 ALTERAZIONI</text>

  <!-- ================= TASTI BIANCHI ================= -->
  <g fill="#ffffff">
    <rect x="8" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="17" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">DO</text>
    <rect x="27.05" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="36.05" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">RE</text>
    <rect x="46.1" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="55.1" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">MI</text>
    <rect x="65.15" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="74.15" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">FA</text>
    <rect x="84.2" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="93.2" y="159" font-size="4.2" text-anchor="middle" fill="#16191d">SOL</text>
    <rect x="103.25" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="112.25" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">LA</text>
    <rect x="122.3" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="131.3" y="159" font-size="4.6" text-anchor="middle" fill="#16191d">SI</text>
    <rect x="141.35" y="148" width="18" height="18" rx="2" stroke="#4a545e" stroke-width="0.6"/>
    <text x="150.35" y="159" font-size="4.4" text-anchor="middle" fill="#16191d">DO'</text>
  </g>
  <text x="165" y="159" font-size="4.6" fill="#0b5fa5" font-weight="bold">8 NATURALI</text>
  <text x="165" y="164.5" font-size="4" fill="#5b6570">13 tasti = un'ottava cromatica intera</text>

  <!-- quota della tastiera -->
  <g stroke="#5b6570" stroke-width="0.35" fill="none">
    <line x1="8" y1="176" x2="159.35" y2="176" marker-start="url(#arrowS)" marker-end="url(#arrowS)"/>
  </g>
  <text x="83" y="182" font-size="4" text-anchor="middle" fill="#5b6570">151 mm — passo Cherry MX 19,05 mm</text>

  <!-- ================= DISPLAY (a destra, in alto) ================= -->
  <g transform="translate(250,58)">
    <circle r="27" fill="#e7ebef" stroke="#4a545e" stroke-width="0.8"/>
    <circle r="22" fill="#0d1117" stroke="#2b3138" stroke-width="0.8"/>
    <circle r="18" fill="none" stroke="#0b5fa5" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text y="-6" font-size="5" text-anchor="middle" fill="#00e5ff" font-weight="bold">ARCADEVOX</text>
    <text y="3" font-size="6.5" text-anchor="middle" fill="#f2b705" font-weight="bold">SAW</text>
    <text y="11" font-size="4" text-anchor="middle" fill="#8fb">OTT +1</text>
    <text y="35" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">DISPLAY GC9A01</text>
    <text y="41" font-size="4.2" text-anchor="middle" fill="#5b6570">tondo 1.28" — 8 schermate</text>
  </g>

  <!-- ================= JOYSTICK (a destra, in basso) ================= -->
  <g transform="translate(250,140)">
    <circle r="24" fill="#e7ebef" stroke="#4a545e" stroke-width="0.8"/>
    <circle r="24" fill="none" stroke="#8a949e" stroke-width="0.35" stroke-dasharray="2 2"/>
    <circle r="9" fill="#f2b705" stroke="rgba(0,0,0,.5)" stroke-width="0.5"/>
    <path d="M0,-11 L0,-15 M0,11 L0,15 M-11,0 L-15,0 M11,0 L15,0"
          stroke="#5b6570" stroke-width="0.6" fill="none" marker-end="url(#arrowS)"/>
    <text y="-18" font-size="3.8" text-anchor="middle" fill="#5b6570">OTTAVA +</text>
    <text y="21" font-size="3.8" text-anchor="middle" fill="#5b6570">OTTAVA -</text>
    <text x="-19" y="-1.5" font-size="3.8" text-anchor="end" fill="#5b6570">ONDA</text>
    <text x="19" y="-1.5" font-size="3.8" text-anchor="start" fill="#5b6570">ONDA</text>
    <text y="33" font-size="5" text-anchor="middle" fill="#16191d" font-weight="bold">JOYSTICK</text>
    <text y="39" font-size="4.2" text-anchor="middle" fill="#5b6570">4 microswitch digitali</text>
  </g>

  <!-- cartiglio -->
  <g>
    <rect x="196" y="8" width="125" height="16" rx="2" fill="#ffffff" stroke="#c8cfd6" stroke-width="0.5"/>
    <text x="202" y="16" font-size="6.5" fill="#16191d" font-weight="bold">ArcadeVox 2.0</text>
    <text x="202" y="21.5" font-size="4" fill="#5b6570">blueprint del pannello — vista dall'alto, quote in mm</text>
  </g>
</svg>
